<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Diary</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar: list of date pages -->
    <aside class="sidebar">
      <header class="sidebar-head">
        <h1>My Diary</h1>
        <div class="head-actions">
          <button id="settings-btn" class="btn icon-btn" title="Theme settings">⚙️</button>
          <button id="new-entry" class="btn btn-primary" title="Jump to today's page">+ Today</button>
        </div>
      </header>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search entries..." autocomplete="off" />
      </div>

      <nav id="page-list" class="page-list" aria-label="Diary pages">
        <!-- date pages get inserted here -->
      </nav>

      <footer class="sidebar-foot">
        <span id="entry-count">0 entries</span>
      </footer>
    </aside>

    <!-- Main: the open page for the selected date -->
    <main class="page">
      <div id="page-view" class="page-view">
        <div class="page-toolbar">
          <input id="page-date" type="date" class="date-picker" />
          <div class="spacer"></div>
          <span id="save-status" class="save-status"></span>
          <button id="delete-entry" class="btn btn-danger" title="Delete this page">Delete</button>
        </div>

        <h2 id="page-heading" class="page-heading">Today</h2>

        <input id="mood" class="mood-input" type="text" placeholder="Mood / one word for today (optional)" maxlength="60" />

        <div class="prompt-bar">
          <button id="prompt-btn" class="btn" title="Get a random thing to write about">💡 Give me a prompt</button>
          <div id="prompt-box" class="prompt-box hidden">
            <span id="prompt-text" class="prompt-text"></span>
            <div class="prompt-actions">
              <button id="prompt-use" class="btn btn-primary btn-sm" title="Add this prompt to your entry">Use it</button>
              <button id="prompt-shuffle" class="btn btn-sm" title="Show a different prompt">↻ Another</button>
            </div>
          </div>
        </div>

        <textarea id="editor" class="editor" placeholder="Write about your day..."></textarea>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <p>No page open.</p>
        <button id="open-today" class="btn btn-primary">Open today's page</button>
      </div>
    </main>
  </div>

  <!-- Settings: theme colors -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="modal" role="dialog" aria-labelledby="settings-title" aria-modal="true">
      <div class="modal-head">
        <h2 id="settings-title">Theme colors</h2>
        <button id="settings-close" class="btn icon-btn" title="Close">✕</button>
      </div>

      <div class="setting-row">
        <label for="color-primary">Primary color</label>
        <span class="setting-hint">Buttons &amp; highlights</span>
        <input id="color-primary" type="color" />
      </div>

      <div class="setting-row">
        <label for="color-secondary">Secondary color</label>
        <span class="setting-hint">Sidebar background</span>
        <input id="color-secondary" type="color" />
      </div>

      <div class="modal-foot">
        <button id="settings-reset" class="btn">Reset to default</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
